name: cs3_engine
description: "Runs CloudStream (.cs3) extensions: in-process on Android, embedded OpenJDK Zero on iOS, a Java sidecar on desktop."
version: 0.5.0
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.akash.cs3engine.android
        pluginClass: Cs3EnginePlugin
      ios:
        pluginClass: Cs3EnginePlugin
  # Engine jars for the JVM hosts (desktop sidecar, iOS embedded VM), produced by
  # tool/build_engine.sh. Android compiles the engine in, so its builds leave them out.
  # The desktop builds also carry the Java runtime tool/build_runtime.dart makes.
  assets:
    - path: assets/engine/
      platforms: [ios, macos, windows, linux]
    - path: assets/runtime/
      platforms: [macos, windows, linux]
